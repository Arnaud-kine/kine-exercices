<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Kiné · exercices</title><style>
:root { --g: #2b7a4b; --gd: #1f5c38; --bg: #f4f5f4; --ink: #1d2320; --mut: #6b746f; --line: #e1e5e2; --red: #c0392b; --warn: #fff6dc; }
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.4; }
main { max-width: 640px; margin: 0 auto; padding: 14px 14px 80px; }
main.narrow { max-width: 420px; padding-top: 40px; }
h1 { font-size: 1.35em; margin: 8px 0 10px; }
h2 { font-size: 1.05em; margin: 20px 0 8px; color: var(--gd); }
p { margin: 6px 0; }
a { color: inherit; text-decoration: none; cursor: pointer; }
.top { background: #fff; border-bottom: 1px solid var(--line); padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 5; }
.brand { font-weight: 700; color: var(--g); }
.who { font-size: .82em; color: var(--mut); text-align: right; }
.lnk { color: var(--g); text-decoration: underline; cursor: pointer; }
.crumb { display: inline-block; color: var(--g); margin: 4px 0 2px; font-size: .92em; }
.meta { font-size: .84em; color: var(--mut); }
.ok { color: var(--g); } .dim { color: #98a09b; font-style: italic; }
.err { color: var(--red); margin-top: 8px; min-height: 1.2em; }
.card { background: #fff; border-radius: 12px; padding: 14px; margin: 10px 0; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
label { display: block; font-size: .84em; color: var(--mut); margin: 10px 0 3px; }
label.chk { display: flex; gap: 8px; align-items: center; color: var(--ink); font-size: .92em; margin: 8px 0; }
label.chk input { width: auto; margin: 0; }
input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccd3cf; border-radius: 8px; font-size: 1em; background: #fff; font-family: inherit; }
input:disabled { background: #f0f2f1; color: #7b847f; }
.bigin { font-size: 1.2em; font-weight: 700; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.btn { display: inline-block; flex: 1 1 auto; text-align: center; padding: 11px 14px; background: var(--g); color: #fff; border: 0; border-radius: 9px; font-size: .96em; cursor: pointer; font-family: inherit; }
.btn.sec { background: #e6ebe8; color: var(--ink); } .btn.danger { background: var(--red); }
.btn.small { flex: 0 0 auto; padding: 7px 11px; font-size: .84em; }
.btn:disabled { opacity: .5; }
.tiles { display: grid; gap: 10px; margin: 12px 0; }
.tile { display: block; background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.07); border-left: 5px solid var(--g); }
.tile.alt { border-left-color: #d98e04; } .tile b { display: block; font-size: 1.08em; } .tile span { color: var(--mut); font-size: .88em; }
.row { background: #fff; border-radius: 10px; padding: 10px 12px; margin: 6px 0; display: flex; align-items: center; gap: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.row.faded { opacity: .75; } .grow { flex: 1; min-width: 0; }
.empty { text-align: center; color: #8a938e; padding: 26px 10px; }
.warn { background: var(--warn); border: 1px solid #f0d98a; border-radius: 9px; padding: 10px; margin: 10px 0; font-size: .9em; }
.grp { font-weight: 700; color: var(--gd); margin: 16px 0 4px; }
.th { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; background: #eef1ef; flex: 0 0 56px; }
.th.ph { display: block; }
.photo { width: 100%; max-height: 360px; object-fit: contain; background: #fff; border-radius: 10px; margin: 10px 0; }
.vid { width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 10px; background: #000; margin: 10px 0; display: block; }
.item { background: #fff; border-radius: 12px; padding: 10px; margin: 8px 0; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
.ihead { display: flex; gap: 10px; align-items: center; }
.mv { display: flex; gap: 4px; } .ib { border: 0; background: #e6ebe8; border-radius: 7px; width: 34px; height: 34px; font-size: 1em; cursor: pointer; }
.dose { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0; }
.dose label { margin: 0; font-size: .74em; } .dose input { padding: 8px 4px; text-align: center; }
.tag { display: inline-block; background: #e6efe9; color: var(--gd); border-radius: 14px; padding: 2px 9px; font-size: .78em; margin: 2px 3px 2px 0; }
.fsel { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 6px 0; }
.chkgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
.linkbox { background: #eaf4ee; border-radius: 9px; padding: 12px; word-break: break-all; font-size: .95em; margin: 10px 0; }
.qr { text-align: center; margin: 10px 0; } .qr svg { width: 230px; height: 230px; background: #fff; border-radius: 8px; }
.tabs { display: flex; gap: 6px; margin: 8px 0; } .tab { border: 0; background: #e6ebe8; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-family: inherit; }
.tab.on { background: var(--g); color: #fff; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.dlg { background: #fff; border-radius: 14px; padding: 18px; width: 100%; max-width: 420px; max-height: 90vh; overflow: auto; }
.dlg h3 { margin: 0 0 6px; }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #1d2320; color: #fff; padding: 9px 16px; border-radius: 22px; font-size: .9em; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; }
#toast.show { opacity: .95; }

  function versBase64(buf) {
    var b = new Uint8Array(buf), s = '';
    for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);

    for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
    return b;
  }

  // Phrase secrète -> clé AES-256 (à faire une fois par session, puis réutiliser la clé)
  async function deriverCle(phrase) {
    var base = await crypto.subtle.importKey('raw', enc.encode(phrase), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: enc.encode(SEL), iterations: ITERATIONS, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
    );
  }

  // Texte -> texte chiffré (nouvel aléa à chaque appel : deux noms identiques donnent deux résultats différents)
  async function chiffrer(cle, texte) {
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, cle, enc.encode(texte));
    var sortie = new Uint8Array(iv.length + ct.byteLength);
    sortie.set(iv, 0);
    sortie.set(new Uint8Array(ct), iv.length);
    return versBase64(sortie);
  }

  // Texte chiffré -> texte. Échoue (exception) si la phrase est fausse ou si le texte a été altéré.
  async function dechiffrer(cle, donnee) {
    var brut = depuisBase64(donnee);
    var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: brut.slice(0, 12) }, cle, brut.slice(12));
    return dec.decode(pt);
  }

  return { deriverCle: deriverCle, chiffrer: chiffrer, dechiffrer: dechiffrer };
})();

  if (!ro) h += '<div class="mv"><button class="ib" data-act="mv" data-i="' + i + '" data-d="-1"' + (i === 0 ? ' disabled' : '') + '>↑</button><button class="ib" data-act="mv" data-i="' + i + '" data-d="1"' + (i === total - 1 ? ' disabled' : '') + '>↓</button><button class="ib" data-act="rm" data-i="' + i + '">✕</button></div>';
  h += '</div><div class="dose">';
  [['series', 'Séries'], ['reps', 'Répét.'], ['duree', 'Durée (s)'], ['repos', 'Repos (s)']].forEach(function (k) {
    h += '<label>' + k[1] + '<input type="number" min="0" inputmode="numeric" data-i="' + i + '" data-k="' + k[0] + '" value="' + esc(it[k[0]] == null ? '' : it[k[0]]) + '"' + (ro ? ' disabled' : '') + '></label>';
  });
  h += '</div><input type="text" placeholder="Remarque pour le patient (facultatif)" data-i="' + i + '" data-k="note" value="' + esc(it.note || '') + '"' + (ro ? ' disabled' : '') + '></div>';
  return h;
}

function distinct(k) {
  var s = [];
  S.ex.forEach(function (e) { var v = e[k]; (Array.isArray(v) ? v : [v]).forEach(function (x) { if (x) s.push(x); }); });
  return sortFr(uniq(s));
}
function sel(k, label, vals) {
  return '<select data-filter="' + k + '"><option value="">' + label + '</option>' + vals.map(function (v) {
    return '<option value="' + esc(v) + '"' + (String(S.f[k]) === String(v) ? ' selected' : '') + '>' + esc(k === 'niv' ? 'Niveau ' + v : v) + '</option>';
  }).join('') + '</select>';
}
function exFiltered() {
  var q = norm(S.f.q);
  return S.ex.filter(function (e) {
    if (S.f.zone && e.zone !== S.f.zone) return false;
    if (S.f.patho && (e.pathologies || []).indexOf(S.f.patho) < 0) return false;
    if (S.f.mat && (e.materiel || []).indexOf(S.f.mat) < 0) return false;
    if (S.f.niv && String(e.niveau) !== S.f.niv) return false;
    if (q && norm(e.nom + ' ' + (e.objectif || '')).indexOf(q) < 0) return false;
    return true;
  });
}
function exRows() {
  var list = exFiltered(), add = S.p.mode === 'add';

function splitList(s) { return (s || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean); }
async function saveExercise(id) {
  var g = function (n) { return Array.prototype.map.call(document.querySelectorAll('input[data-grp="' + n + '"]:checked'), function (i) { return i.value; }); };
  var patch = {
    nom: document.getElementById('x_nom').value.trim(), zone: document.getElementById('x_zone').value.trim() || null, niveau: num(document.getElementById('x_niv').value),
    pathologies: uniq(g('patho').concat(splitList(document.getElementById('x_patho_new').value))), materiel: uniq(g('mat').concat(splitList(document.getElementById('x_mat_new').value))),

  };

  var r = await sb.from('exercises').update(patch).eq('id', id).select().single();
  if (r.error) throw r.error;
  var i = S.ex.findIndex(function (e) { return e.id === id; }); S.ex[i] = r.data; reindex();
  toast('Exercice enregistré');

/* ---------- gestion des filtres (propriétaire) ---------- */
function viewFilters() {
  var tabs = [['zone', 'Zones'], ['patho', 'Pathologies'], ['mat', 'Matériel']];
  var col = { zone: 'zone', patho: 'pathologies', mat: 'materiel' }[S.tab];
  var counts = {};
  S.ex.forEach(function (e) { var v = e[col]; (Array.isArray(v) ? v : [v]).forEach(function (x) { if (x) counts[x] = (counts[x] || 0) + 1; }); });
  var noPatho = S.tab === 'patho' ? S.ex.filter(function (e) { return !(e.pathologies || []).length; }).length : 0;
  var h = '<h1>Filtres</h1><p class="meta">Renommer une valeur la change sur tous les exercices concernés. Pour attribuer un filtre à un exercice précis : Exercices, puis Modifier.</p><div class="tabs">' +
    tabs.map(function (t) { return '<button class="tab' + (S.tab === t[0] ? ' on' : '') + '" data-act="tab" data-t="' + t[0] + '">' + t[1] + '</button>'; }).join('') + '</div>';
  if (S.tab === 'patho') h += '<p class="meta">' + noPatho + ' exercice(s) sans pathologie.</p>';
  h += sortFr(Object.keys(counts)).map(function (v) {
    return '<div class="row"><div class="grow"><strong>' + esc(v) + '</strong><div class="meta">' + counts[v] + ' exercice(s)</div></div>' +
      '<button class="btn sec small" data-act="renamef" data-v="' + esc(v) + '">Renommer</button>' +
      (S.tab !== 'zone' ? '<button class="btn danger small" data-act="removef" data-v="' + esc(v) + '">Retirer</button>' : '') + '</div>';
  }).join('');
  return shell(h, { view: 'home', label: 'Accueil' });
}
async function bulkUpdate(targets, patchFor) {
  for (var i = 0; i < targets.length; i++) {
    var e = targets[i];
    var r = await sb.from('exercises').update(patchFor(e)).eq('id', e.id).select().single();
    if (r.error) throw r.error;
    S.ex[S.ex.findIndex(function (x) { return x.id === e.id; })] = r.data;
    if (i % 20 === 19) toast((i + 1) + ' / ' + targets.length);
  }
  reindex();
}
async function renameFilter(old) {
  var col = { zone: 'zone', patho: 'pathologies', mat: 'materiel' }[S.tab];
  var v = await modal({ title: 'Renommer « ' + old + ' »', fields: [{ id: 'n', label: 'Nouveau nom', value: old }], ok: 'Renommer' });
  if (!v) return; var nw = v.n.trim(); if (!nw || nw === old) return;
  var targets = S.ex.filter(function (e) { return S.tab === 'zone' ? e.zone === old : (e[col] || []).indexOf(old) >= 0; });
  if (!(await ask('Confirmer', targets.length + ' exercice(s) seront modifiés : « ' + old + ' » devient « ' + nw + ' ».', 'Renommer'))) return;
  await bulkUpdate(targets, function (e) { return S.tab === 'zone' ? { zone: nw } : (function () { var p = {}; p[col] = uniq(e[col].map(function (x) { return x === old ? nw : x; })); return p; })(); });
  toast('Valeur renommée'); render();
}
async function removeFilter(old) {
  var col = { patho: 'pathologies', mat: 'materiel' }[S.tab];
  var targets = S.ex.filter(function (e) { return (e[col] || []).indexOf(old) >= 0; });
  if (!(await ask('Retirer « ' + old + ' » ?', 'Cette valeur sera retirée de ' + targets.length + ' exercice(s). Les exercices eux-mêmes ne sont pas supprimés.', 'Retirer', true))) return;
  await bulkUpdate(targets, function (e) { var p = {}; p[col] = e[col].filter(function (x) { return x !== old; }); return p; });
  toast('Valeur retirée'); render();
}

  if (m.modified_by && m.modified_by !== m.created_by) s += ' · Modifié par ' + who(m.modified_by) + ' le ' + fmtDate(m.updated_at);
  return s + ' · ' + (m.items || []).length + ' ex.';
}
function modelRows() {
  var q = norm(S.f.mq), mode = S.view === 'quick' ? 'quick' : (S.p.mode || 'view');
  var list = S.models.filter(function (m) { return !q || norm(m.titre + ' ' + (m.soustitre || '') + ' ' + (m.is_base ? 'cabinet' : who(m.created_by))).indexOf(q) >= 0; });
  if (!list.length) return '<div class="empty">Aucun modèle ne correspond.</div>';
  var groups = {}; list.forEach(function (m) { (groups[m.zone || 'Autre'] = groups[m.zone || 'Autre'] || []).push(m); });
  return sortFr(Object.keys(groups)).map(function (z) {
    return '<div class="grp">' + esc(z) + ' (' + groups[z].length + ')</div>' + groups[z].sort(function (a, b) { return a.titre.localeCompare(b.titre, 'fr'); }).map(function (m) {

      return '<a class="row" ' + attr + '><div class="grow"><strong>' + esc(m.titre) + '</strong>' + (m.soustitre ? ' — ' + esc(m.soustitre) : '') + '<div class="meta">' + esc(modelMeta(m)) + '</div></div><span>›</span></a>';
    }).join('');
  }).join('');
}
function modelsPage(title, crumb, extra) {

function viewQuick() {
  return modelsPage('⚡ Lien rapide', { view: 'home', label: 'Accueil' },
    '<p class="meta">Touchez un modèle : le lien et le QR code sont créés immédiatement.</p><div class="btns"><button class="btn sec small" ' + N('journal') + '>Historique des liens rapides (' + S.programs.filter(function (g) { return g.rapide; }).length + ')</button></div>');
}
function viewModel() {
  var m = modelById(S.p.id), items = itemsFromModel(m);
  var h = '<h1>' + esc(m.titre) + '</h1>' + (m.soustitre ? '<p>' + esc(m.soustitre) + '</p>' : '') + '<p class="meta">' + esc(modelMeta(m)) + (m.frequence ? ' · ' + esc(m.frequence) : '') + '</p>' +
    (m.note ? '<p>' + esc(m.note) + '</p>' : '') + items.map(function (it) {
      return '<div class="row">' + thumb(it) + '<div class="grow"><strong>' + esc(it.nom) + '</strong><div class="meta">' + [it.series ? it.series + ' séries' : '', it.reps ? it.reps + ' rép.' : '', it.duree ? it.duree + ' s' : ''].filter(Boolean).join(' · ') + '</div></div></div>';
    }).join('') +
    '<div class="btns"><button class="btn" data-act="quickmodel" data-id="' + m.id + '">⚡ Créer un lien rapide</button>' + (canEditModel(m) ? '<button class="btn sec" ' + N('modelEdit', { id: m.id }) + '>Modifier</button>' : '') + '</div>';
  return shell(h, { view: 'models', label: 'Modèles' });
}
function viewModelEdit() {
  var id = S.p.id || null;
  if (!S.draft || S.draft.kind !== 'model' || S.draft.id !== id) {
    var m = id ? modelById(id) : null;
    S.draft = { kind: 'model', id: id, titre: m ? m.titre : '', soustitre: m ? m.soustitre || '' : '', zone: m ? m.zone || '' : '', frequence: m ? m.frequence || '' : '', note: m ? m.note || '' : '', items: m ? itemsFromModel(m) : [] };
    S.dirty = false;
  }
  var d = S.draft;
  var h = '<h1>' + (id ? 'Modifier le modèle' : 'Nouveau modèle') + '</h1><div class="card"><label>Titre</label><input data-d="titre" value="' + esc(d.titre) + '">' +
    '<label>Sous-titre (ce qui distingue ce modèle — obligatoire)</label><input data-d="soustitre" value="' + esc(d.soustitre) + '" placeholder="ex : phase aiguë, sportif actif…">' +
    '<label>Zone</label><input data-d="zone" list="zl" value="' + esc(d.zone) + '"><datalist id="zl">' + distinct('zone').map(function (z) { return '<option value="' + esc(z) + '">'; }).join('') + '</datalist>' +
    '<label>Fréquence</label><input data-d="frequence" value="' + esc(d.frequence) + '" placeholder="ex : 3x/semaine">' +
    '<label>Note clinique</label><input data-d="note" value="' + esc(d.note) + '"></div>' +
    (d.items.length ? d.items.map(function (it, i) { return itemRow(it, i, false, d.items.length); }).join('') : '<div class="empty">Aucun exercice.</div>') +
    '<div class="btns"><button class="btn sec" ' + N('picker', { mode: 'add', target: 'model', id: id }) + '>+ Ajouter un exercice</button></div>' +
    '<div class="btns"><button class="btn" data-act="savemodelform">Enregistrer le modèle</button>' + (id ? '<button class="btn danger" data-act="delmodel" data-id="' + id + '">Supprimer</button>' : '') + '</div>';
  return shell(h, id ? { view: 'model', p: { id: id }, label: 'Annuler' } : { view: 'models', label: 'Annuler' });
}
function toRefs(items) {
  return items.map(function (it) { var e = findEx(it.ex); return { ex: e ? exKey(e) : it.ex, series: it.series, reps: it.reps, duree: it.duree, repos: it.repos, note: it.note || null }; });
}
async function saveModel() {
  var d = S.draft; d.titre = d.titre.trim(); d.soustitre = d.soustitre.trim();
  if (!d.titre || !d.soustitre) { await info('Le titre et le sous-titre sont obligatoires.'); return; }
  if (!d.items.length) { await info('Ajoutez au moins un exercice.'); return; }
  var titleChanged = !d.id || norm(modelById(d.id).titre) !== norm(d.titre);
  var sim = titleChanged ? S.models.filter(function (m) { return m.id !== d.id && norm(m.titre) === norm(d.titre); }) : [];
  if (sim.length && !(await ask('Un modèle du même nom existe déjà', 'Déjà présent : ' + sim.map(function (m) { return '« ' + m.titre + (m.soustitre ? ' — ' + m.soustitre : '') + ' »'; }).join(', ') + '. Créer quand même celui-ci ?', 'Créer quand même'))) return;
  if (!d.zone) { var z = {}; d.items.forEach(function (it) { if (it.zone) z[it.zone] = (z[it.zone] || 0) + 1; }); var ks = Object.keys(z).sort(function (a, b) { return z[b] - z[a]; }); d.zone = ks[0] || 'Autre'; }
  var row = { titre: d.titre, soustitre: d.soustitre, zone: d.zone, frequence: d.frequence || null, note: d.note || null, items: toRefs(d.items) }, r;
  if (d.id) { row.modified_by = S.me.id; row.updated_at = new Date().toISOString(); r = await sb.from('models').update(row).eq('id', d.id).select().single(); }
  else { row.is_base = false; row.created_by = S.me.id; r = await sb.from('models').insert(row).select().single(); }
  if (r.error) throw r.error;
  var i = S.models.findIndex(function (m) { return m.id === r.data.id; }); if (i >= 0) S.models[i] = r.data; else S.models.push(r.data);
  S.draft = null; toast('Modèle enregistré'); go('model', { id: r.data.id });
}
async function deleteModel(id) {
  var m = modelById(id);
  if (!(await ask('Supprimer ce modèle ?', '« ' + m.titre + ' » sera supprimé définitivement. Les programmes déjà créés pour des patients ne sont pas touchés.', 'Supprimer', true))) return;
  var r = await sb.from('models').delete().eq('id', id); if (r.error) throw r.error;
  S.models = S.models.filter(function (x) { return x.id !== id; }); S.draft = null; toast('Modèle supprimé'); go('models');
}
async function useModel(modelId) {
  var m = modelById(modelId), items = itemsFromModel(m);
  var g = await createProgram({ patientId: S.p.patientId, titre: m.titre + (m.soustitre ? ' — ' + m.soustitre : ''), items: items, note: m.note, frequence: m.frequence });
  S.draft = null; go('program', { id: g.id });
}
/* ---------- navigation et affichage ---------- */
var VIEWS = {
  login: viewLogin, noprofile: viewNoProfile, home: viewHome, patients: viewPatients, patient: viewPatient, newprog: viewNewProg,
  program: viewProgram, assign: viewAssign, quick: viewQuick, quickResult: viewQuickResult, journal: viewJournal,
  library: viewPicker, picker: viewPicker, exercise: viewExercise, exEdit: viewExEdit, filters: viewFilters,
  models: viewModels, model: viewModel, modelEdit: viewModelEdit
};
function render() { $app.innerHTML = VIEWS[S.view](); fillQR(); }
function go(view, p, opt) {
  p = p || {};
  if ((view === 'program' || view === 'modelEdit') && !p.keep) S.draft = null;
  if (view === 'picker' && S.view !== 'exercise') S.added = 0;
  if (view === 'picker' || view === 'library') S.f.n = PAGE;
  if (!S.draft) S.dirty = false;
  S.view = view; S.p = p;
  try {
    var st = { view: view, p: p };
    if (opt && opt.replace) history.replaceState(st, ''); else history.pushState(st, '');
  } catch (e) { /* historique indisponible : l'application fonctionne sans */ }
  render(); window.scrollTo(0, 0);
}
/* Bouton « retour » du téléphone / du navigateur */
window.addEventListener('popstate', function (e) {
  var ov = document.querySelector('.overlay');
  if (ov) { /* une fenêtre est ouverte : « retour » la ferme au lieu de changer d'écran */
    var b = ov.querySelector('[data-m="no"]') || ov.querySelector('[data-m="ok"]');
    try { history.pushState({ view: S.view, p: S.p }, ''); } catch (x) { }
    if (b) b.click(); return;
  }
  var st = e.state; if (!st || !VIEWS[st.view]) return;
  if (!S.me && st.view !== 'login') return;
  if (S.me && st.view === 'login') { go('home', {}, { replace: true }); return; }
  if (S.dirty && S.draft && S.draft.kind === 'program' && ['picker', 'exercise', 'program'].indexOf(st.view) < 0) { saveProgram().catch(function () { }); }
  S.view = st.view; S.p = st.p || {};
  if (!S.draft) S.dirty = false;
  render(); window.scrollTo(0, 0);
});
function refreshResults() {
  var el = document.getElementById('results'); if (!el) return;
  el.innerHTML = S.view === 'patients' ? patientRows() : (S.view === 'models' || S.view === 'quick') ? modelRows() : exRows();
}
function run(fn) { try { var r = fn(); if (r && r.catch) r.catch(fail); } catch (e) { fail(e); } }

async function leaveGuard(toView) {
  var keep = ['picker', 'exercise', 'modelEdit', 'program'];
  if (!S.dirty || !S.draft || keep.indexOf(toView) >= 0) return true;
  if (S.draft.kind === 'program') { await saveProgram(); toast('Modifications enregistrées'); return true; }
  if (S.draft.kind === 'model') return ask('Abandonner les modifications ?', 'Les changements non enregistrés de ce modèle seront perdus.', 'Abandonner', true);
  return true;
}
function moveItem(i, d) {
  var a = S.draft.items, j = i + d; if (j < 0 || j >= a.length) return;
  var t = a[i]; a[i] = a[j]; a[j] = t; S.dirty = true; render();
}
async function endProgram() {
  var d = S.draft, g = progById(d.id);
  if (!(await ask('Terminer ce programme ?', 'Il restera visible dans l\'historique, en lecture seule. Vous pourrez le reprendre en le dupliquant.', 'Terminer', true))) return;
  await saveProgram();
  var r = await sb.from('programs').update({ statut: 'termine' }).eq('id', d.id).select().single();
  if (r.error) throw r.error;
  S.programs[S.programs.findIndex(function (x) { return x.id === d.id; })] = r.data; S.draft = null;
  go(g.patient_id ? 'patient' : 'home', g.patient_id ? { id: g.patient_id } : {});
}
async function programToModel() {
  var g = progById(S.draft.id);
  await saveProgram();
  var z = {}; S.draft.items.forEach(function (it) { if (it.zone) z[it.zone] = (z[it.zone] || 0) + 1; });
  var ks = Object.keys(z).sort(function (a, b) { return z[b] - z[a]; });
  S.draft = { kind: 'model', id: null, titre: g.titre.replace(/\s*\(reprise\)$/, ''), soustitre: '', zone: ks[0] || '', frequence: g.frequence || '', note: g.note || '', items: clone(S.draft.items) };
  S.dirty = true; go('modelEdit', { id: null, keep: true });
}

async function handle(a, t) {
  var id = t.getAttribute('data-id');
  switch (a) {
    case 'nav': {
      var view = t.getAttribute('data-view'), p = JSON.parse(t.getAttribute('data-p') || '{}');
      if (!(await leaveGuard(view))) return;
      go(view, p); return;
    }
    case 'login': {
      var r = await sb.auth.signInWithPassword({ email: document.getElementById('em').value.trim(), password: document.getElementById('pw').value });
      if (r.error) { document.getElementById('lerr').textContent = 'Email ou mot de passe incorrect.'; return; }
      await afterLogin(r.data.user); return;
    }
    case 'logout': await sb.auth.signOut(); S.me = null; S.prof = null; S.draft = null; go('login', {}, { replace: true }); return;
    case 'forget': await forgetKey(); render(); return;
    case 'askkey': await ensureKey(); render(); return;
    case 'newpatient': await newPatient(); return;
    case 'blankprog': {
      var v = await modal({ title: 'Nouveau programme', fields: [{ id: 't', label: 'Titre du programme', placeholder: 'ex : Lombalgie — reprise' }], ok: 'Créer' });
      if (!v || !v.t.trim()) return;
      var g = await createProgram({ patientId: id, titre: v.t.trim() }); S.draft = null; go('program', { id: g.id }); return;
    }
    case 'reprendre': await reprendre(id); return;
    case 'mv': moveItem(+t.getAttribute('data-i'), +t.getAttribute('data-d')); return;
    case 'rm': S.draft.items.splice(+t.getAttribute('data-i'), 1); S.dirty = true; render(); return;
    case 'saveprog': await saveProgram(); toast('Programme enregistré'); render(); return;
    case 'assign': await saveProgram(); go('assign', { id: S.draft.id }); return;
    case 'endprog': await endProgram(); return;
    case 'savemodel': await programToModel(); return;
    case 'copy': await copyText(t.getAttribute('data-t')); return;
    case 'saveassign': await saveAssign(id); return;
    case 'pick': pickEx(id); return;
    case 'more': S.f.n += PAGE; refreshResults(); return;
    case 'saveex': await saveExercise(id); return;
    case 'tab': S.tab = t.getAttribute('data-t'); render(); return;
    case 'renamef': await renameFilter(t.getAttribute('data-v')); return;
    case 'removef': await removeFilter(t.getAttribute('data-v')); return;
    case 'quickmodel': await quickLink(id); return;
    case 'usemodel': await useModel(id); return;
    case 'savemodelform': await saveModel(); return;
    case 'delmodel': await deleteModel(id); return;
  }
}

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]'); if (!t) return;
  e.preventDefault(); var a = t.getAttribute('data-act');
  run(function () { return handle(a, t); });
});
function onField(e) {
  var t = e.target;
  if (t.hasAttribute('data-filter')) { S.f[t.getAttribute('data-filter')] = t.value; S.f.n = PAGE; refreshResults(); return; }
  if (!S.draft) return;
  if (t.hasAttribute('data-k')) { var k = t.getAttribute('data-k'); S.draft.items[+t.getAttribute('data-i')][k] = k === 'note' ? t.value : num(t.value); S.dirty = true; return; }
  if (t.hasAttribute('data-d')) { S.draft[t.getAttribute('data-d')] = t.value; S.dirty = true; }
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.id === 'pw') { var b = document.querySelector('[data-act="login"]'); if (b) b.click(); }
});
window.addEventListener('beforeunload', function (e) { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });

window.__kine = { S: S };
boot();
})();

</script>
</body></html>
